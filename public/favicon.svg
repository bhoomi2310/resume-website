<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- macOS squircle app icon base with pastel gradient -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />
  
  <!-- Subtle glass inner window -->
  <rect x="10" y="11" width="44" height="42" rx="7" fill="#FFFFFF" fill-opacity="0.82" stroke="#FFFFFF" stroke-width="1" filter="url(#softShadow)" />
  
  <!-- Window Header Bar -->
  <rect x="10" y="11" width="44" height="11" rx="7" fill="#F1F5F9" fill-opacity="0.8" />
  
  <!-- Traffic lights: red, yellow, green -->
  <circle cx="16" cy="16.5" r="2" fill="#FF5F56" />
  <circle cx="22" cy="16.5" r="2" fill="#FFBD2E" />
  <circle cx="28" cy="16.5" r="2" fill="#27C93F" />
  
  <!-- Monogram B for Bhoomi in Slate/Violet -->
  <text x="32" y="41" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">B</text>
</svg>
